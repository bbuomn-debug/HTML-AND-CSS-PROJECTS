<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-Page Website</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
line-height: 1.6;
background-color: #f4f4f4;
color: #333;
}
header {
background: #1e293b;
color: #fff;
padding: 20px;
text-align: center;
}
nav a {
color: #fff;
margin: 0 12px;
text-decoration: none;
}
section {
padding: 30px;
margin: 20px auto;
max-width: 800px;
background: #fff;
border-radius: 8px;
}
footer {
text-align: center;
padding: 15px;
background: #1e293b;
color: #fff;
}
</style>
</head>
<body>
<header>
<h1>Welcome to My One-Page Website</h1>
<nav>
<a href="#about">About</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section id="about">
<h2>About</h2>
<p>This is a simple one-page website created for the HTML assignment.</p>
</section>

<section id="services">
<h2>Services</h2>
<p>Clean layout, responsive sections, and basic HTML/CSS structure.</p>
</section>

<section id="contact">
<h2>Contact</h2>
<p>Email: example@email.com</p> <img src="https://via.placeholder.com/300" alt="One Page Website Preview">

<form>
<label for="name">Name:</label>
<input type="text" id="name" name="name" placeholder="Enter your name">
<input type="submit" value="Submit">
</form>

<iframe src="https://www.example.com" width="300" height="200" title="Embedded Content"></iframe>

</section>

<footer>
<p>&copy; 2026 One-Page Website</p>
</footer>
</body>
</html>
